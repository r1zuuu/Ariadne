[package]
name = "app"
version = "0.1.0"
description = "Ariadne desktop shell around the Next.js static export"
authors = ["r1zuuu"]
license = ""
repository = "https://github.com/r1zuuu/Ariadna"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
