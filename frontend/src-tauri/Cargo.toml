[package]
name = "app"
version = "0.1.0"
description = "Ariadne desktop shell around the Next.js static export"
authors = ["r1zuuu"]
license = ""
repository = "https://github.com/r1zuuu/Ariadne"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
# Already in the tree as one of tauri's own dependencies; declared here because
# the skills commands derive Serialize on the shapes they hand back.
serde = { version = "1", features = ["derive"] }
# Opens a URL in the system browser. Without it window.open in the webview does
# nothing at all, which is what silently broke sign-in through Google and GitHub.
tauri-plugin-opener = "2"
